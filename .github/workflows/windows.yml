name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-Windows
          path: |
            release/*.exe
            release/*.zip
      # Every build on main becomes the latest release, which the app's update banner links to.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Forma for Windows (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Download Forma-Setup and run it. It installs over your current version and keeps your data.
          files: release/Forma-Setup-*.exe
